name: Go

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Go quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install linters
        run: |
          go install golang.org/x/lint/golint@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Verify formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "gofmt found formatting issues"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golint
        run: golint ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run tests
        run: go test ./...

      - name: Build the CLI
        run: go build -o gai .
